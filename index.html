/* VOICE: spokojny dziennik pokładowy, szybkie wpisy kciukiem
   IDEA: wskaźnik poziomu wody w zbiorniku + kafle jak przełączniki w kokpicie
   PICTURE: duży pierścień wody na ekranie Dodaj
   COLOUR and TYPE: błękit wody, biel, koralowy akcent; systemowy krój, grube cyfry
   LAYOUT: jedna kolumna, dolny pasek nawigacji, arkusz wpisu wysuwany od dołu */
/* Tryb nocny: ciepłe barwy bez niebieskiego, przyjazne zasypianiu */

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(4vw,14px) 14px}
h1{font-size:30px;line-height:1.05;margin:0;font-weight:800}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.loc{line-height:1.15}.loc .l1{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px}.loc .l1 em{font-style:normal;font-weight:500;font-size:12px;color:var(--mute);margin-left:14px}.loc .l1 em.in{color:var(--acc);font-weight:700}.loc .lbl{margin-top:8px;font-size:12px;text-transform:none}.loc .ev{color:var(--ink);font-weight:600;margin-top:1px}.loc b{font-size:28px;font-weight:800}.loc span{font-size:15px;color:var(--mute);font-weight:600}.loc small{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:4px;max-width:62vw}
.now{font-size:14px;color:var(--mute);text-align:right;line-height:1.3}
.now b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
button,select{font:inherit;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.pri{background:var(--sea);color:var(--onacc);border-color:var(--sea);font-weight:600}
.danger{color:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip.on{background:var(--sea);color:var(--onacc);border-color:var(--sea)}
label{font-size:14px;color:var(--mute);display:block;margin:10px 0 4px}
input[type=number],input[type=text],input[type=url],input[type=datetime-local],textarea{font:inherit;font-size:16px;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
textarea{padding:10px 12px;min-height:70px}
input[type=range]{width:100%;accent-color:var(--sea);min-height:36px}
.water{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.ring{width:min(101px,26vw);aspect-ratio:1;position:relative;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{transition:stroke-dashoffset .5s ease}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:clamp(17px,4.6vw,22px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring span{font-size:11px;color:var(--mute)}
.wbtn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.wbtn button{min-height:38px;font-size:14px;padding:0 6px}.rings{display:flex;justify-content:space-around;gap:8px}.rc{display:grid;justify-items:center;gap:2px}.rc .cap{font-size:13px;font-weight:600;color:var(--mute);text-align:center}.rc .cap small{font-weight:400}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-height:76px;border-radius:16px;border:0;background:var(--card);display:grid;place-content:center;gap:2px;text-align:center;padding:8px;font-weight:600}
.tile i{display:block;width:26px;height:6px;border-radius:3px;margin:0 auto 6px;background:var(--c,var(--sea))}
.tile small{font-weight:400;font-size:12px;color:var(--mute)}
.day{margin:18px 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.day b{font-size:17px}.day span{font-size:13px;color:var(--mute)}
.ent{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;padding:10px 12px;margin:6px 0;min-height:56px}
.ent i{width:8px;height:32px;border-radius:4px;background:var(--c,var(--sea))}
.ent .t{font-variant-numeric:tabular-nums;text-align:right;font-size:14px;line-height:1.25;white-space:nowrap}
.ent .t small{display:block;color:var(--mute);font-size:12px}
.ent .m small{display:block;color:var(--mute);font-size:13px}
.pend{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:middle}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(4vw,16px) calc(18px + env(safe-area-inset-bottom))}
.sheet .acts{display:flex;gap:8px;margin-top:16px}.sheet .acts button{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px max(2vw,6px) calc(4px + env(safe-area-inset-bottom));z-index:10}
nav a{color:var(--mute);text-decoration:none;font-size:11px;font-weight:600;text-align:center;padding:8px 0;min-height:52px}
nav a i{display:block;width:22px;height:4px;border-radius:2px;margin:2px auto 6px;background:currentColor;opacity:.35}
nav a.on{color:var(--sea)}nav a.on i{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
.bars .b{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.bars .tr{height:12px;border-radius:6px;background:var(--sea2);overflow:hidden}.bars .tr i{display:block;height:100%;background:var(--sea);border-radius:6px}
.bars .v{text-align:right;font-variant-numeric:tabular-nums}
.rec{background:var(--rec);color:#fff7ef}.rec .hint{color:#fff7efcc}
details{border-top:1px solid var(--line);padding:10px 0}details summary{font-weight:600;cursor:pointer;min-height:32px}
.mus{flex:none;display:block}
.timebtn{width:100%;text-align:left;font-weight:600}
.dialov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40}.dialov.open{display:flex}
.dialbox{background:var(--bg);border-radius:20px;padding:16px;width:min(340px,92vw)}
.dialhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.dialhead b{font-size:16px}
.dialtime{display:flex;justify-content:center;align-items:center;gap:4px;margin:10px 0;font-size:34px;font-weight:800}
.dialtime button{font-size:34px;font-weight:800;min-height:52px;border:0;background:none;color:var(--mute);padding:0 6px}.dialtime button.on{color:var(--sea)}
#dsvg{width:100%;display:block;touch-action:none}.dialbox .acts{display:flex;gap:8px;margin-top:12px}.dialbox .acts button{flex:1}
.set{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--card);border-radius:14px;padding:10px;margin:8px 0}
.set small{display:block;color:var(--mute);font-size:12px;margin:4px 0}
.set .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.set .g3 input{min-height:40px;padding:0 8px}
.set .row button{min-height:36px;font-size:14px}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ptiles button{display:flex;align-items:center;gap:8px;text-align:left;min-height:56px;padding:6px 10px;font-size:14px;line-height:1.2}
.mini{margin:10px 0 4px}.mini svg{display:block}
.st{font-size:13px;color:var(--mute);text-align:center;margin:10px 0}
a{color:var(--sea)}.btnlink{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;background:var(--sea);color:var(--onacc);font-weight:600;text-decoration:none;margin-top:4px}

@media(prefers-reduced-motion:reduce){.ring .v,.toast{transition:none}}
</style>

/* ---------- Czas i strefy ----------
   Każdy wpis ma: utc (moment w czasie), tz (strefa telefonu w chwili wpisu), local (godzina lokalna).
   Dzień wpisu = data lokalna w jego strefie. Gdy strefa różni się od domowej, pokazujemy też czas domowy. */
const devTz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}};
function parts(d,tz){const o={};new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);return o}
const localStr=(d,tz)=>{const p=parts(d,tz);return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`};
const offMin=(d,tz)=>{const p=parts(d,tz);return Math.round((Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute,+p.second)-d.getTime())/60000)};
function fromLocal(str,tz){const [a,b]=str.split('T');const [y,m,dd]=a.split('-').map(Number);const [h,mi]=b.split(':').map(Number);let g=Date.UTC(y,m-1,dd,h,mi);let t=g-offMin(new Date(g),tz)*60000;t=g-offMin(new Date(t),tz)*60000;return new Date(t)}
const short=tz=>{try{return new Intl.DateTimeFormat('pl-PL',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName').value}catch(e){return tz}};
const dayName=s=>new Date(s+'T12:00Z').toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const todayLocal=()=>localStr(new Date(),devTz()).slice(0,10);
const rnd5=d=>new Date(Math.round(d.getTime()/3e5)*3e5);
function mk(typ,f){const tz=devTz(),d=f.when?fromLocal(f.when,tz):rnd5(new Date());return{id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),utc:d.toISOString(),tz,offset_min:offMin(d,tz),local:localStr(d,tz),typ,ilosc:f.ilosc??null,co:f.co||[],opis:f.opis||'',vitc_mg:f.vitc_mg||null,foto:'',sets:f.sets||[],kcal:f.kcal??null,dawki:f.dawki||null}}

let syncing=false;
async function sync(){if(syncing||!S.url||!S.key||!navigator.onLine){status();return}syncing=true;status('Synchronizuję…');
 try{if(Q.length){let batch=[],size=0;for(const o of Q){const l=JSON.stringify(o).length;if(batch.length&&(size+l>2e6||batch.length>=40))break;batch.push(o);size+=l}const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:S.key,ops:batch})}).then(x=>x.json());
   if(!r.ok)throw new Error(r.error||'błąd');const done=new Set(r.done);Q=Q.filter(o=>!done.has(o.qid));persist();if(Q.length){syncing=false;return sync()}}
  const u=S.url+(S.url.includes('?')?'&':'?')+'key='+encodeURIComponent(S.key);
  const [l,z]=await Promise.all([fetch(u+'&action=list&days=120').then(x=>x.json()),fetch(u+'&action=recs').then(x=>x.json())]);
  if(l.ok){const pend=new Set(Q.map(o=>o.entry?o.entry.id:o.id));const n={};Object.values(E).forEach(e=>{if(pend.has(e.id))n[e.id]=e});l.entries.forEach(e=>{if(!pend.has(e.id))n[e.id]=e});E=n;persist();meRestore()}
  if(z.ok){R=z.recs;ls.set('recs',R)}
  ls.set('last',new Date().toISOString());if(!document.querySelector('.sheet.open'))render()}
 catch(e){status('Nie udało się połączyć. Wpisy czekają w telefonie.')}
 syncing=false;status()}

function shrink(file,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};img.onerror=no;img.src=u})}
const list=()=>Object.values(E).sort((a,b)=>b.utc.localeCompare(a.utc));
const dayOf=e=>e.local.slice(0,10);
const sumDay=(typ,day)=>list().filter(e=>e.typ===typ&&dayOf(e)===day).reduce((s,e)=>s+(+e.ilosc||0),0);
const pending=id=>Q.some(o=>(o.entry?o.entry.id:o.id)===id);
function val(e){const t=T[e.typ];if(e.typ==='notatka'&&e.kcal)return e.kcal+' kcal';if(e.typ==='suple'&&e.dawki)return'';if(e.ilosc==null||e.ilosc==='')return'';if(e.typ==='woda'&&e.vitc_mg)return e.ilosc+' ml · wit. C '+e.vitc_mg+' mg';if(KCAL[e.typ]){const k=kcalOf(e);return e.ilosc+' ml'+(k!=null?' · ~'+k+' kcal':'')}const v=String(e.ilosc).replace('.',',');return t.u.startsWith('/')?v+t.u:v+' '+t.u}
function sleepFor(day){const L=list().slice().reverse();const w=L.find(e=>e.typ==='pobudka'&&dayOf(e)===day);if(!w)return null;const s=L.filter(e=>e.typ==='spac'&&e.utc<w.utc).pop();if(!s)return null;const h=(new Date(w.utc)-new Date(s.utc))/36e5;return h>0&&h<16?h:null}

const KCAL={napoj:{'Cola':0.42,'Cola zero':0,'Woda kokosowa':0.19,'Sok':0.45,'Napój izotoniczny':0.25,'Herbata':0,'Inny':0.3},alkohol:{'Piwo':0.43,'Wino':0.83,'Wódka / mocny':2.31,'Cydr':0.5,'Inne':0.8},kawa:{'Czarna':0.02,'Z mlekiem':0.35}};

const kcalOf=e=>e.kcal!=null&&e.kcal!==''?+e.kcal:e.typ==='posilek'?(e.ilosc?+e.ilosc:null):estKcal(e.typ,e.co,+e.ilosc);

let pex='';

 const P=k=>rows.filter(x=>x[k]!=null&&x[k]!=='').map(x=>({d:x.d,v:+x[k]}));

function vUst(){return `<section class="card"><h2>Połączenie z arkuszem</h2><label for="s_url">Adres skryptu (Apps Script)</label><input id="s_url" type="url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/…/exec"><label for="s_key">Tajny klucz</label><input id="s_key" type="text" value="${esc(S.key)}" autocomplete="off"><div class="row" style="margin-top:12px"><button class="pri" data-ss="1">Zapisz i synchronizuj</button></div></section>
 <section class="card"><h2>Profil</h2><label for="s_prof">Czy latasz zawodowo?</label><select id="s_prof">${Object.entries(PROF).map(([k,v])=>`<option value="${k}"${S.prof===k?' selected':''}>${v}</option>`).join('')}</select><p class="hint">„Nie latam” ukrywa Grafik, WOCL i aklimatyzację. Short haul i long haul pokazują wszystko; różnią się zaleceniami (krótkie rotacje i wczesne meldowania vs nocne loty i zmiany stref).</p></section>
 <section class="card" id="sec-me"><h2>O mnie</h2><p class="hint" style="margin:0 0 8px">Na tej podstawie układam zalecenia. Wypełnij, co chcesz – wszystko jest opcjonalne. Profil trafia do Twojego arkusza.</p><details${S.me&&S.me.zm?'':' open'}><summary>${S.me&&S.me.zm?'Edytuj profil':'Wypełnij profil'}</summary>${meHtml()}<div class="row" style="margin-top:12px"><button class="pri" data-mesave="1">Zapisz profil</button></div></details>${S.me&&S.me.zm?`<p class="hint">Ostatni zapis: ${fmtDT(S.me.zm)}</p>`:''}</section>
 <section class="card"><h2>Strefa domowa i cele</h2><label for="s_home">Strefa domowa</label><input id="s_home" type="text" value="${esc(S.home)}"><p class="hint">Telefon jest teraz w strefie ${esc(devTz())} (${esc(short(devTz()))}). Każdy wpis zapisuje swoją strefę, więc godziny z postojów się nie mieszają.</p><label for="s_kc">Cel kalorii (kcal)</label><input id="s_kc" type="number" value="${esc(S.kcal||2300)}"><label for="s_cel">Cel wody (ml)</label><input id="s_cel" type="number" value="${esc(S.cel)}"><label for="s_vc">Witamina C w wodzie – mg na każde 250 ml</label><input id="s_vc" type="number" value="${esc(S.vitc)}"><p class="hint">Mieszanka askorbinianu sodu z kwasem askorbinowym. Gdy na ekranie Dodaj zaznaczysz „z witaminą C”, dawka liczy się proporcjonalnie, np. 500 ml wody = 2 × ta dawka.</p></section>
${(()=>{const ri=recInfo();return `<section class="card" id="sec-zal"><h2>Zalecenia</h2><p style="margin:0">${ri?'Ostatnia aktualizacja: <b>'+fmtDT(ri.tytul)+'</b>':'Jeszcze bez zaleceń.'}</p>${ri&&ri.tekst?`<p style="margin:8px 0 0">${esc(ri.tekst)}</p>`:''}<p class="hint">Claude aktualizuje je automatycznie 2 razy dziennie, ok. 7:40C i 18:40C, na podstawie wpisów i grafiku. Pobierają się przy synchronizacji.</p><a class="btnlink" href="https://claude.ai/new?q=${encodeURIComponent(REQ+' Profil: '+PROF[S.prof]+'. Moje dane są we wpisie typu profil.')}" target="_blank" rel="noopener">Poproś o zalecenia teraz</a><p class="hint">Otwiera Claude z gotową prośbą – wystarczy ją wysłać. Najpierw dodaj zaległe wpisy i poczekaj na synchronizację.</p></section>`})()}
 ${FLY()?'':'<!--'}<section class="card"><h2>Grafik lotów</h2><p class="hint" style="margin:0 0 10px">Wgraj PDF „Individual plan” z CrewLink. Godziny z grafiku (UTC) zamienię na lokalne. Ponowne wgranie tego samego miesiąca (np. v2) zastępuje poprzednią wersję.</p><button class="pri" data-pdf="1">Wgraj grafik (PDF)</button><p class="hint" id="pdfmsg">${esc(pdfMsg)}</p><h2 style="margin-top:14px">Wgrane grafiki (pamiętam 2 ostatnie)</h2>${rostersHtml()}</section>${FLY()?'':'-->'}
 <section class="card"><h2>Jak korzystać</h2><details><summary>Bez internetu</summary><p style="margin:6px 0">Aplikacja działa w pełni offline: wpisy zapisują się w telefonie i czekają w kolejce („Do wysłania: N”), a wysyłają się same, gdy wróci zasięg. Stronę można odświeżać offline – wczyta się z pamięci telefonu. Nie trzeba tego robić dla odliczań: nagłówek przelicza się co 30 s i od razu po powrocie do aplikacji. Offline nie dojdą tylko nowe zalecenia i nowa wersja aplikacji.</p></details><details><summary>Dodawanie wpisów</summary><p style="margin:6px 0">Przyciski wody (+250, +330, +500 ml) zapisują wpis od razu; „Usuń … ml” kasuje ostatnią porcję wody. Kafelek (posiłek, kawa, sen, trening…) i „Inna ilość” otwierają okienko z ilością, opisem, kcal i zdjęciem. Godzina wpisuje się sama (zaokrąglona do 5 min, w strefie telefonu); zmienisz ją tarczą zegara. Każdy wpis poprawisz lub usuniesz w Historii.</p></details><details><summary>Oznaczenia czasu</summary><p style="margin:6px 0">Każda godzina ma literę: L – czas lokalny miejsca, w którym jesteś (lub lotniska podanego obok), C – czas warszawski (CET/CEST), Z – UTC. Lotniska są kodami IATA; tylko lokalizacja w nagłówku ma pełną nazwę miasta i kod ICAO.</p></details><details><summary>Nagłówek</summary><p style="margin:6px 0">Na górze: godzina lokalna, UTC i warszawska, pod nią WOCL (02:00–05:59 w strefie, do której jesteś zaaklimatyzowany) i stan aklimatyzacji wg EASA ORO.FTL.105 (B – WAW, D – lokalnie, X – nieokreślony). Niżej lokalizacja i następne wydarzenie: lot (meldowanie i wylot) albo zalecenie z godziną, z odliczaniem.</p></details><details><summary>Profil i „O mnie”</summary><p style="margin:6px 0">Wypełnij kartę „O mnie” (wiek, cele, zdrowie, tryb dnia, jedzenie) i naciśnij „Zapisz profil” – trafi do arkusza i na tej podstawie układam zalecenia. W karcie Profil wybierz, czy latasz (short haul / long haul), czy nie. Dla osób, które nie latają, znikają Grafik, WOCL i aklimatyzacja – reszta działa tak samo.</p></details><details><summary>Grafik</summary><p style="margin:6px 0">Wgraj PDF „Individual plan” z CrewLink przyciskiem „Wgraj grafik (PDF)” w Ustawieniach; loty i służby zobaczysz w zakładce Grafik. Aplikacja pamięta dwa miesiące; nowy grafik pojawia się 17. dnia miesiąca – wtedy przypomni o wgraniu. Meldowanie bierze z C/I w grafiku. Grafik trafia też do arkusza, więc zalecenia są do niego dopasowane.</p></details><details><summary>Zalecenia</summary><p style="margin:6px 0">Aktualizuję je automatycznie dwa razy dziennie, ok. 07:40C i 18:40C, na podstawie wpisów i grafiku. Czas ostatniej aktualizacji i notatka są w sekcji Zalecenia wyżej. Zalecenia z godziną (sen, drzemka, posiłek, trening, kofeina) są w zakładce Zalecenia, w następnym wydarzeniu i w kalendarzu Google „dziennik” (na 3 dni naprzód). Link „Poproś o zalecenia teraz” otwiera rozmowę ze mną.</p></details><details><summary>Kalorie</summary><p style="margin:6px 0">Kawa, napoje i alkohol liczą się same z ml i rodzaju. Posiłki bez kcal szacuję przy aktualizacji – ze zdjęcia albo opisu. Swoją wartość możesz wpisać w polu kcal; wtedy jej nie nadpisuję. Zdjęcia wysyłają się tylko z internetem.</p></details><details><summary>Witamina C</summary><p style="margin:6px 0">Dawka w ustawieniu wyżej jest na każde 250 ml wody. Gdy na ekranie Dodaj włączysz „z witaminą C”, każda porcja wody zapisze się z dawką proporcjonalną do ilości.</p></details><details><summary>Nowa wersja</summary><p style="margin:6px 0">Gdy wprowadzę zmiany, zamknij aplikację i otwórz ją z internetem. Numer wersji widzisz poniżej.</p></details></section>
 <section class="card"><h2>Dane w telefonie</h2><p class="hint" style="margin:0">Wersja aplikacji: 18 (19.11.2026) · Wpisów: ${Object.keys(E).length} · do wysłania: ${Q.length}</p></section>`}

/* ---------- Render i zdarzenia ---------- */
const TT={dodaj:'Dodaj',historia:'Historia',grafik:'Grafik',zalecenia:'Zalecenia',postep:'Postęp',ustawienia:'Ustawienia'};
const route=()=>{const h=location.hash.slice(1);return TT[h]&&!(h==='grafik'&&!FLY())?h:'dodaj'};
function clock(){if(route()==='dodaj'&&!document.querySelector('.sheet.open'))$('#ttl').innerHTML=headLoc();const tz=devTz(),n=new Date();$('#now').innerHTML=`<b>${localStr(n,tz).slice(11)}${sfx(tz)}</b>${sfx(tz)!=='Z'?` · ${localStr(n,'UTC').slice(11)}Z`:''}<br>${n.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short',timeZone:tz})}${tz!==S.home?` · WAW ${localStr(n,S.home).slice(11)}C`:''}${route()==='dodaj'&&FLY()?woclNow():''}`}
function render(){const r=route();document.querySelector('header').classList.toggle('home',r==='dodaj');if(r==='dodaj')$('#ttl').innerHTML=headLoc();else $('#ttl').textContent=TT[r];document.querySelectorAll('#nav a').forEach(a=>{a.classList.toggle('on',a.dataset.r===r);a.hidden=a.dataset.r==='grafik'&&!FLY()});
 $('#view').innerHTML={grafik:vGrafikTab,dodaj:vDodaj,historia:vHistoria,zalecenia:vZal,postep:vPostep,ustawienia:vUst}[r]();clock();status()}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
$('#ttl').addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();location.hash='ustawienia';setTimeout(()=>{const el=document.getElementById(a.dataset.go);if(el)el.scrollIntoView({behavior:'smooth'})},80)});
$('#view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.w)add('woda',{ilosc:+d.w,vitc_mg:S.vcOn?Math.round(S.vitc*d.w/250):null,co:S.vcOn?['Witamina C']:[]});
 else if(d.vct){S.vcOn=!S.vcOn;ls.set('settings',S);render()}
 else if(d.undo){const x=E[d.undo];delete E[d.undo];push({op:'delete',id:x.id});toast('Cofnięto');render()}
 else if(d.open)openSheet(d.open);
 else if(d.edit)openSheet(null,E[d.edit]);
 else if(d.f!==undefined){filt=d.f;render()}
 else if(d.pex){pex=d.pex;render()}
 else if(d.past){showPast=!showPast;render()}
 else if(d.pdf){$('#pdfIn').click()}
 else if(d.goal){S.me=readMe();const g=S.me.cele||[];S.me.cele=g.includes(d.goal)?g.filter(x=>x!==d.goal):[...g,d.goal];ls.set('settings',S);b.classList.toggle('on')}
 else if(d.mesave){saveMe();render()}
 else if(d.ss){S.url=$('#s_url').value.trim();S.key=$('#s_key').value.trim();S.home=$('#s_home').value.trim()||'Europe/Warsaw';S.cel=+$('#s_cel').value||3000;S.vitc=+$('#s_vc').value||1000;S.kcal=+$('#s_kc').value||2300;ls.set('settings',S);toast('Zapisano ustawienia');sync()}});
$('#view').addEventListener('change',async e=>{if(e.target.dataset&&e.target.dataset.me){S.me=Object.assign(readMe(),{zm:(S.me||{}).zm});ls.set('settings',S);return}if(e.target.id==='s_prof'){S.prof=e.target.value;ls.set('settings',S);toast(PROF[S.prof]);render();return}if(['s_home','s_cel','s_vc','s_kc'].includes(e.target.id)){S.home=$('#s_home').value.trim()||'Europe/Warsaw';S.cel=+$('#s_cel').value||3000;S.vitc=+$('#s_vc').value||1000;S.kcal=+$('#s_kc').value||2300;ls.set('settings',S)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){closeSheet();return}const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.close)closeSheet();else if(d.save)saveSheet();
 else if(d.del){const x=E[cur.id];delete E[cur.id];push({op:'delete',id:x.id});closeSheet();toast('Usunięto');render()}
 else if(d.sc){cur.ilosc=+d.sc;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))}
 else if(d.q){$('#f_il').value=d.q;updKc()}
 else if(d.ds){cur.dawki[d.ds]=d.dv;$('#doses').innerHTML=dosesHtml()}
 else if(d.pick){openDial($('#f_when').value)}
 else if(d.vc){cur.vitc=cur.vitc?null:(+$('#f_vc').value||S.vitc);b.classList.toggle('on')}
 else if(d.ph){$('#'+d.ph).click()}
 else if(d.co){if(SINGLE[cur.typ]){cur.co=cur.co[0]===d.co?[]:[d.co];b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',cur.co.includes(c.dataset.co)))}else{const i=cur.co.indexOf(d.co);i<0?cur.co.push(d.co):cur.co.splice(i,1);b.classList.toggle('on')}
  if(cur.typ==='suple')$('#doses').innerHTML=dosesHtml();updKc();
  if(d.co==='Body by Science'){$('#bbs').style.display=cur.co.includes('Body by Science')?'block':'none'}}
 else if(d.addex){const p=$('#picker');p.innerHTML=p.innerHTML?'':pickerHtml()}
 else if(d.ex){const l=lastSet(d.ex);cur.sets.push({ex:d.ex,kg:l?l.kg:null,reps:null,tul:null});$('#picker').innerHTML='';$('#sets').innerHTML=setsHtml()}
 else if(d.rm){cur.sets.splice(+d.rm,1);if(sw){clearInterval(sw.h);sw=null}$('#sets').innerHTML=setsHtml()}
 else if(d.swi!==undefined){const i=+d.swi;if(sw&&sw.i===i){const sec=Math.round((Date.now()-sw.t0)/1000);clearInterval(sw.h);sw=null;cur.sets[i].tul=sec;$('#sets').innerHTML=setsHtml()}else{if(sw)clearInterval(sw.h);sw={i,t0:Date.now()};sw.h=setInterval(()=>{const el=$('#tul'+i);if(el)el.value=Math.round((Date.now()-sw.t0)/1000)},500);$('#sets').innerHTML=setsHtml()}}});
$('#sheet').addEventListener('change',async e=>{if(!['f_ph','f_ph2'].includes(e.target.id)||!e.target.files[0])return;try{const f=e.target.files[0];cur.photo=await shrink(f,1024,.72);cur.thumb=await shrink(f,240,.6);const p=$('#f_prev');p.src=cur.thumb;p.style.display='block'}catch(x){toast('Nie udało się wczytać zdjęcia')}});
function updKc(){const k=$('#f_kc'),il=$('#f_il');if(!k||cur.kcalEd||!KCAL[cur.typ])return;const v=estKcal(cur.typ,cur.co,il?+il.value:0);k.value=v??''}
$('#sheet').addEventListener('input',e=>{if(e.target.id==='f_kc')cur.kcalEd=true;if(e.target.id==='f_il')updKc();if(e.target.id==='f_il'&&e.target.type==='range')$('#f_v').textContent=e.target.value;const d=e.target.dataset;if(d.si!==undefined&&cur){cur.sets[+d.si][d.sf]=e.target.value===''?null:+e.target.value}});
let pdfMsg='',picking=false;
$('#pdfIn').addEventListener('change',async e=>{picking=false;const f=e.target.files[0];if(!f)return;pdfMsg='Czytam grafik '+f.name+'…';render();
 try{const t=await importRoster(f);pdfMsg='Wgrano: '+t;toast('Grafik wgrany')}catch(x){pdfMsg='Nie udało się: '+(x.message||x);toast('Błąd grafiku')}e.target.value='';render()});
$('#pdfIn').addEventListener('click',()=>{picking=true});
DARK.addEventListener&&DARK.addEventListener('change',render);
$('#dialov').addEventListener('click',e=>{if(e.target.id==='dialov'){$('#dialov').classList.remove('open');return}const g=e.target.closest('[data-v]');if(g){const v=+g.dataset.v;if(DL.mode==='h'){DL.h=v;DL.mode='m'}else DL.m=v;drawDial();return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.dd){const t=new Date(DL.date+'T12:00Z');t.setUTCDate(t.getUTCDate()+ +d.dd);DL.date=t.toISOString().slice(0,10);drawDial()}
 else if(d.dm){DL.mode=d.dm;drawDial()}
 else if(d.dx==='now'){const v=localStr(rnd5(new Date()),cur?cur.tz:devTz());DL={date:v.slice(0,10),h:+v.slice(11,13),m:+v.slice(14,16),mode:'h'};drawDial()}
 else if(d.dx==='cancel')$('#dialov').classList.remove('open');
 else if(d.dx==='ok'){const p=n=>String(n).padStart(2,'0');const v=`${DL.date}T${p(DL.h)}:${p(DL.m)}`;$('#f_when').value=v;$('#f_whenBtn').textContent=fmtWhen(v);$('#dialov').classList.remove('open')}});
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!picking){render();sync()}});
setInterval(clock,30000);setInterval(()=>{if(Q.length)sync()},60000);
render();sync();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
