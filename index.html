function parseRoster(lines){
 const per=lines.join(' ').match(/Period:\s*(\d{2})(\w{3})(\d{2})\s*-\s*(\d{2})(\w{3})(\d{2})/);
 if(!per)throw new Error('Nie rozpoznano okresu grafiku');
 const y=2000+ +per[3],m=MON[per[2]];
 const start=Date.UTC(y,m,+per[1]),end=Date.UTC(2000+ +per[6],MON[per[5]],+per[4])+864e5;
 const t=(d,hm)=>Date.UTC(y,m,d,+hm.slice(0,2),+hm.slice(2,4));
 const out=[];let day=null,ci=null,mm;
 for(const raw of lines){
  const L=raw.replace(/\s+/g,' ').trim();let rest=L;
  const dm=L.match(/^(\d{2})\.\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b\s*(.*)$/);
  if(dm){day=+dm[1];rest=dm[3]}
  if(day==null)continue;
  if((mm=rest.match(/C\/I\s+([A-Z]{3})\s+(\d{4})/)))ci=t(day,mm[2]);
  if((mm=rest.match(/(DH\/)?LO\s*(\d{1,4})\s+(?:R\s+)?([A-Z]{3})\s+(\d{4})\s+(\d{4})\s+([A-Z]{3})(?:\s+(\d{3}))?/))){
   const dep=t(day,mm[4]);let arr=t(day,mm[5]);if(arr<=dep)arr+=864e5;
   out.push({k:'lot',fn:'LO'+mm[2],dh:!!mm[1],from:mm[3],to:mm[6],dep,arr,ac:mm[7]||'',ci:(ci&&dep>=ci&&dep-ci<6*36e5)?ci:null});ci=null}
  else if((mm=rest.match(/\b(STBTEL|STBY\w*|RES\w*|ASEC|E-LEARN|B78[A-Z]{3}|SIM\w*|CRM\w*|MED\w*)\s+(?:([A-Z]{3})\s+)?(\d{4})\s+(\d{4})/))){
   const s=t(day,mm[3]);let e=t(day,mm[4]);if(e<=s)e+=864e5;out.push({k:'sluzba',code:mm[1],st:mm[2]||'',dep:s,arr:e})}
 }
 const pr=lines.join(' ').match(/printed by\s+\S+\s+(\d{2})(\w{3})(\d{2})\s+(\d{2}):(\d{2})/);
 return{start,end,items:out,printed:pr?Date.UTC(2000+ +pr[3],MON[pr[2]],+pr[1],+pr[4],+pr[5]):null}}

/* ---------- Czas i strefy ----------

const offMin=(d,tz)=>{const p=parts(d,tz);return Math.round((Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute,+p.second)-d.getTime())/60000)};

 if(k.startsWith('waga')){const N=+k.split('<=')[1]||+v;const W=list().filter(e=>e.typ==='waga'&&e.ilosc!=null).reverse();const start=(S.me&&+S.me.waga)||(W[0]&&+W[0].ilosc);const cur=W.length?+W[W.length-1].ilosc:start;if(!start||!cur)return{p:0,lbl:'zapisz wagę'};return{p:start<=N?1:Math.max(0,Math.min(1,(start-cur)/(start-N))),lbl:`${String(cur).replace('.',',')} kg → cel ${N} kg`}}
 if(k==='woda'){const D=+v;let n=0;for(let i=0;i<60;i++){const d=localStr(new Date(Date.now()-i*864e5),devTz()).slice(0,10);if(sumDay('woda',d)>=(S.cel||3000))n++;else if(i>0||n)break}return{p:Math.min(1,n/D),lbl:`seria ${n} z ${D} dni`}}
 if(k==='bezcoli'){const D=+v;const c=list().find(e=>e.typ==='napoj'&&(e.co||[]).includes('Cola'));const first=list().slice(-1)[0];const from=c?c.utc:(first?first.utc:new Date().toISOString());const n=Math.floor((Date.now()-new Date(from))/864e5);return{p:Math.min(1,n/D),lbl:`${n} z ${D} dni bez coli`}}
 if(k==='treningi'){const D=+v;const n=list().filter(e=>e.typ==='trening').length;return{p:Math.min(1,n/D),lbl:`${n} z ${D} treningów`}}
 return null}

function vUst(){return `<section class="card"><h2>Połączenie z arkuszem</h2><label for="s_url">Adres skryptu (Apps Script)</label><input id="s_url" type="url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/…/exec"><label for="s_key">Tajny klucz</label><input id="s_key" type="text" value="${esc(S.key)}" autocomplete="off"><div class="row" style="margin-top:12px"><button class="pri" data-ss="1">Zapisz i synchronizuj</button></div></section>
 <section class="card"><h2>Profil</h2><label for="s_prof">Czy latasz zawodowo?</label><select id="s_prof">${Object.entries(PROF).map(([k,v])=>`<option value="${k}"${S.prof===k?' selected':''}>${v}</option>`).join('')}</select><p class="hint">„Nie latam” ukrywa Grafik, WOCL i aklimatyzację. Short haul i long haul pokazują wszystko; różnią się zaleceniami (krótkie rotacje i wczesne meldowania vs nocne loty i zmiany stref).</p></section>
 <section class="card" id="sec-me"><h2>O mnie</h2><p class="hint" style="margin:0 0 8px">Na tej podstawie układam zalecenia. Wypełnij, co chcesz – wszystko jest opcjonalne. Profil trafia do Twojego arkusza.</p><details${S.me&&S.me.zm?'':' open'}><summary>${S.me&&S.me.zm?'Edytuj profil':'Wypełnij profil'}</summary>${meHtml()}<div class="row" style="margin-top:12px"><button class="pri" data-mesave="1">Zapisz profil</button></div></details>${S.me&&S.me.zm?`<p class="hint">Ostatni zapis: ${fmtDT(S.me.zm)}</p>`:''}</section>
 <section class="card"><h2>Strefa domowa i cele</h2><label for="s_home">Strefa domowa</label><input id="s_home" type="text" value="${esc(S.home)}"><p class="hint">Telefon jest teraz w strefie ${esc(devTz())} (${esc(short(devTz()))}). Każdy wpis zapisuje swoją strefę, więc godziny z postojów się nie mieszają.</p><label for="s_kc">Cel kalorii (kcal)</label><input id="s_kc" type="number" value="${esc(S.kcal||2300)}"><label for="s_cel">Cel wody (ml)</label><input id="s_cel" type="number" value="${esc(S.cel)}"><label for="s_vc">Witamina C w wodzie – mg na każde 250 ml</label><input id="s_vc" type="number" value="${esc(S.vitc)}"><p class="hint">Mieszanka askorbinianu sodu z kwasem askorbinowym. Gdy na ekranie Dodaj zaznaczysz „z witaminą C”, dawka liczy się proporcjonalnie, np. 500 ml wody = 2 × ta dawka.</p></section>
${(()=>{const ri=recInfo();return `<section class="card" id="sec-zal"><h2>Zalecenia</h2><p style="margin:0">${ri?'Ostatnia aktualizacja: <b>'+fmtDT(ri.tytul)+'</b>':'Jeszcze bez zaleceń.'}</p>${ri&&ri.tekst?`<p style="margin:8px 0 0">${esc(ri.tekst)}</p>`:''}<p class="hint">Claude aktualizuje je automatycznie 2 razy dziennie na podstawie wpisów i grafiku. Pobierają się przy synchronizacji.</p><label>Godziny automatycznych aktualizacji (czas C)</label><div class="row" style="flex-wrap:nowrap"><input id="akt1" type="text" inputmode="numeric" value="${esc((S.akt||['07:40','18:40'])[0])}" placeholder="0740" style="width:100px"><input id="akt2" type="text" inputmode="numeric" value="${esc((S.akt||['07:40','18:40'])[1])}" style="width:100px"><button data-aktsave="1">Zapisz</button></div><p class="hint">Nowe godziny zaczną obowiązywać od następnej aktualizacji. Najlepiej rano przed pierwszym posiłkiem i wieczorem przed kolacją.</p><a class="btnlink" href="https://claude.ai/new?q=${encodeURIComponent(REQ+' Profil: '+PROF[S.prof]+'. Moje dane są we wpisie typu profil.')}" target="_blank" rel="noopener">Poproś o zalecenia teraz</a><p class="hint">Otwiera Claude z gotową prośbą – wystarczy ją wysłać. Najpierw dodaj zaległe wpisy i poczekaj na synchronizację.</p></section>`})()}
 ${FLY()?'':'<!--'}<section class="card"><h2>Grafik lotów</h2><p class="hint" style="margin:0 0 10px">Wgraj PDF „Individual plan” z CrewLink. Godziny z grafiku (UTC) zamienię na lokalne. Ponowne wgranie tego samego miesiąca (np. v2) zastępuje poprzednią wersję.</p><button class="pri" data-pdf="1">Wgraj grafik (PDF)</button><p class="hint" id="pdfmsg">${esc(pdfMsg)}</p><h2 style="margin-top:14px">Wgrane grafiki (pamiętam 2 ostatnie)</h2>${rostersHtml()}</section>${FLY()?'':'-->'}
 <section class="card"><h2>Jak korzystać</h2><details><summary>Bez internetu</summary><p style="margin:6px 0">Aplikacja działa w pełni offline: wpisy zapisują się w telefonie i czekają w kolejce („Do wysłania: N”), a wysyłają się same, gdy wróci zasięg. Stronę można odświeżać offline – wczyta się z pamięci telefonu. Nie trzeba tego robić dla odliczań: nagłówek przelicza się co 30 s i od razu po powrocie do aplikacji. Offline nie dojdą tylko nowe zalecenia i nowa wersja aplikacji.</p></details><details><summary>Dodawanie wpisów</summary><p style="margin:6px 0">Przyciski wody (+250, +330, +500 ml) zapisują wpis od razu; „Usuń … ml” kasuje ostatnią porcję wody. Kafelek (posiłek, kawa, sen, trening…) i „Inna ilość” otwierają okienko z ilością, opisem, kcal i zdjęciem. Godzina wpisuje się sama (zaokrąglona do 5 min, w strefie telefonu); zmienisz ją tarczą zegara. Każdy wpis poprawisz lub usuniesz w Historii.</p></details><details><summary>Oznaczenia czasu</summary><p style="margin:6px 0">Każda godzina ma literę: L – czas lokalny miejsca, w którym jesteś (lub lotniska podanego obok), C – czas warszawski (CET/CEST), Z – UTC. Lotniska są kodami IATA; tylko lokalizacja w nagłówku ma pełną nazwę miasta i kod ICAO.</p></details><details><summary>Nagłówek</summary><p style="margin:6px 0">Na górze: godzina lokalna, UTC i warszawska, pod nią WOCL (02:00–05:59 w strefie, do której jesteś zaaklimatyzowany) i stan aklimatyzacji wg EASA ORO.FTL.105 (B – WAW, D – lokalnie, X – nieokreślony). Niżej lokalizacja i następne wydarzenie: lot (meldowanie i wylot) albo zalecenie z godziną, z odliczaniem.</p></details><details><summary>Profil i „O mnie”</summary><p style="margin:6px 0">Wypełnij kartę „O mnie” (wiek, cele, zdrowie, tryb dnia, jedzenie) i naciśnij „Zapisz profil” – trafi do arkusza i na tej podstawie układam zalecenia. W karcie Profil wybierz, czy latasz (short haul / long haul), czy nie. Dla osób, które nie latają, znikają Grafik, WOCL i aklimatyzacja – reszta działa tak samo.</p></details><details><summary>Grafik</summary><p style="margin:6px 0">Wgraj PDF „Individual plan” z CrewLink przyciskiem „Wgraj grafik (PDF)” w Ustawieniach; loty i służby zobaczysz w zakładce Grafik. Aplikacja pamięta dwa miesiące; nowy grafik pojawia się 17. dnia miesiąca – wtedy przypomni o wgraniu. Meldowanie bierze z C/I w grafiku. Grafik trafia też do arkusza, więc zalecenia są do niego dopasowane.</p></details><details><summary>Zalecenia</summary><p style="margin:6px 0">Aktualizuję je automatycznie dwa razy dziennie, ok. 07:40C i 18:40C, na podstawie wpisów i grafiku. Czas ostatniej aktualizacji i notatka są w sekcji Zalecenia wyżej. Zalecenia z godziną (sen, drzemka, posiłek, trening, kofeina) są w zakładce Zalecenia, w następnym wydarzeniu i w kalendarzu Google „dziennik” (na 3 dni naprzód). Link „Poproś o zalecenia teraz” otwiera rozmowę ze mną.</p></details><details><summary>Plan dnia i Przed i po</summary><p style="margin:6px 0">Plan dnia to harmonogram z godzinami: sen, posiłki, suplementy, ćwiczenia (z ikoną ćwiczenia). „Przed i po” – raz w miesiącu zdjęcie z przodu i z profilu według instrukcji; po synchronizacji oceniam postawę, rysuję obrys i dopisuję opis. Zdjęcia w dobrej jakości są w telefonie, pełne – na Twoim Dysku. Poprawić zdjęcia można do 2 dni po sesji.</p></details><details><summary>Kalorie</summary><p style="margin:6px 0">Kawa, napoje i alkohol liczą się same z ml i rodzaju. Posiłki bez kcal szacuję przy aktualizacji – ze zdjęcia albo opisu. Swoją wartość możesz wpisać w polu kcal; wtedy jej nie nadpisuję. Zdjęcia wysyłają się tylko z internetem.</p></details><details><summary>Witamina C</summary><p style="margin:6px 0">Dawka w ustawieniu wyżej jest na każde 250 ml wody. Gdy na ekranie Dodaj włączysz „z witaminą C”, każda porcja wody zapisze się z dawką proporcjonalną do ilości.</p></details><details><summary>Nowa wersja</summary><p style="margin:6px 0">Gdy wprowadzę zmiany, zamknij aplikację i otwórz ją z internetem. Numer wersji widzisz poniżej.</p></details></section>
 <section class="card"><h2>Dane w telefonie</h2><p class="hint" style="margin:0">Wersja aplikacji: 26 (21.11.2026) · Wpisów: ${Object.keys(E).length} · do wysłania: ${Q.length}</p></section>`}

/* ---------- Render i zdarzenia ---------- */
const TT={dodaj:'Dodaj',plan:'Plan dnia',jadlospis:'Jadłospis',historia:'Historia',grafik:'Grafik',zalecenia:'Zalecenia',postep:'Postęp',sylwetka:'Przed i po',ustawienia:'Ustawienia'};
const route=()=>{const h=location.hash.slice(1);return TT[h]&&!(h==='grafik'&&!FLY())?h:'dodaj'};
function clock(){if(route()==='dodaj'&&!document.querySelector('.sheet.open'))$('#ttl').innerHTML=headLoc();const tz=devTz(),n=new Date();$('#now').innerHTML=`<b>${localStr(n,tz).slice(11)}${sfx(tz)}</b>${sfx(tz)!=='Z'?` · ${localStr(n,'UTC').slice(11)}Z`:''}<span style="display:block;margin-top:7px">${n.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short',timeZone:tz})}${tz!==S.home?` · WAW ${localStr(n,S.home).slice(11)}C`:''}</span>${route()==='dodaj'&&FLY()?woclNow():''}`}
function render(){const r=route();document.querySelector('header').classList.toggle('home',r==='dodaj');if(r==='dodaj')$('#ttl').innerHTML=headLoc();else $('#ttl').textContent=TT[r];document.querySelectorAll('#nav a').forEach(a=>{a.classList.toggle('on',a.dataset.r===r);a.hidden=a.dataset.r==='grafik'&&!FLY()});
 $('#view').innerHTML={plan:vPlan,jadlospis:vMenu,sylwetka:vSylwetka,grafik:vGrafikTab,dodaj:vDodaj,historia:vHistoria,zalecenia:vZal,postep:vPostep,ustawienia:vUst}[r]();clock();status();if(r==='sylwetka')bpFill();const na=document.querySelector('#nav a.on');if(na&&na.scrollIntoView)na.scrollIntoView({block:'nearest',inline:'center'})}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
$('#ttl').addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();location.hash='ustawienia';setTimeout(()=>{const el=document.getElementById(a.dataset.go);if(el)el.scrollIntoView({behavior:'smooth'})},80)});
$('#view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.w)add('woda',{ilosc:+d.w,vitc_mg:S.vcOn?Math.round(S.vitc*d.w/250):null,co:S.vcOn?['Witamina C']:[]});
 else if(d.vct){S.vcOn=!S.vcOn;ls.set('settings',S);render()}
 else if(d.bpfix!==undefined){bpFixOpen=d.bpfix==='1';bpMode='fix';BP={przod:null,profil:null};render()}
 else if(d.bpc||d.bpg){const m=d.mode||'new';if(m!==bpMode){BP={przod:null,profil:null};bpMode=m}bpSlot=d.bpc||d.bpg;picking=true;$(d.bpc?'#bpCam':'#bpGal').click()}
 else if(d.bpsave){bpSave()}
 else if(d.bpcmp){bpCmp=d.bpcmp;render()}
 else if(d.rvsave){rvSave()}
 else if(d.aktsave){const hm=v=>{const d=v.replace(/\D/g,'');if(!d||d.length>4)return null;const h=d.length<=2?+d:+d.slice(0,d.length-2),m=d.length<=2?0:+d.slice(-2);return h<24&&m<60?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'):null};const a=[$('#akt1').value,$('#akt2').value].map(hm);if(a.some(v=>!v)){toast('Wpisz godziny, np. 0740 i 1840');return}S.akt=a.sort();render();ls.set('settings',S);const dd=new Date(),tz=devTz();const e={id:'konfig',utc:dd.toISOString(),tz,offset_min:offMin(dd,tz),local:localStr(dd,tz),typ:'konfig',ilosc:null,co:S.akt,opis:'Aktualizacje zaleceń: '+S.akt.join(' i ')+' C',vitc_mg:null,foto:'',sets:[],kcal:null,dawki:null,akt:S.akt};E.konfig=e;push({op:'upsert',entry:e});toast('Zapisano: '+S.akt.join(' i ')+'C')}
 else if(d.rvdel){rvSave(true)}
 else if(d.bpov){b.closest('.card').querySelectorAll('.bpimg').forEach(x=>x.classList.toggle('noov'))}
 else if(d.undo){const x=E[d.undo];delete E[d.undo];push({op:'delete',id:x.id});toast('Cofnięto');render()}
 else if(d.open)openSheet(d.open);
 else if(d.edit)openSheet(null,E[d.edit]);
 else if(d.f!==undefined){filt=d.f;render()}
 else if(d.pex){pex=d.pex;render()}
 else if(d.past){showPast=!showPast;render()}
 else if(d.pdf){$('#pdfIn').click()}
 else if(d.goal){S.me=readMe();const g=S.me.cele||[];S.me.cele=g.includes(d.goal)?g.filter(x=>x!==d.goal):[...g,d.goal];ls.set('settings',S);b.classList.toggle('on')}
 else if(d.mesave){saveMe();render()}
 else if(d.ss){S.url=$('#s_url').value.trim();S.key=$('#s_key').value.trim();S.home=$('#s_home').value.trim()||'Europe/Warsaw';S.cel=+$('#s_cel').value||3000;S.vitc=+$('#s_vc').value||1000;S.kcal=+$('#s_kc').value||2300;ls.set('settings',S);toast('Zapisano ustawienia');sync()}});
$('#view').addEventListener('change',async e=>{if(e.target.dataset&&e.target.dataset.me){S.me=Object.assign(readMe(),{zm:(S.me||{}).zm});ls.set('settings',S);return}if(e.target.id==='s_prof'){S.prof=e.target.value;ls.set('settings',S);toast(PROF[S.prof]);render();return}if(['s_home','s_cel','s_vc','s_kc'].includes(e.target.id)){S.home=$('#s_home').value.trim()||'Europe/Warsaw';S.cel=+$('#s_cel').value||3000;S.vitc=+$('#s_vc').value||1000;S.kcal=+$('#s_kc').value||2300;ls.set('settings',S)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){closeSheet();return}const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.close)closeSheet();else if(d.save)saveSheet();
 else if(d.del){const x=E[cur.id];delete E[cur.id];push({op:'delete',id:x.id});kids(x.id).forEach(k=>{delete E[k.id];push({op:'delete',id:k.id})});closeSheet();toast('Usunięto');render()}
 else if(d.lat){cur.co=[d.lat];b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))}
 else if(d.sc){cur.ilosc=+d.sc;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))}
 else if(d.q){$('#f_il').value=d.q;updKc()}
 else if(d.ds){cur.dawki[d.ds]=d.dv;$('#doses').innerHTML=dosesHtml()}
 else if(d.pick){openDial($('#f_when').value)}
 else if(d.vc){cur.vitc=cur.vitc?null:(+$('#f_vc').value||S.vitc);b.classList.toggle('on')}
 else if(d.ph){$('#'+d.ph).click()}
 else if(d.co){if(SINGLE[cur.typ]){cur.co=cur.co[0]===d.co?[]:[d.co];b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',cur.co.includes(c.dataset.co)))}else{const i=cur.co.indexOf(d.co);i<0?cur.co.push(d.co):cur.co.splice(i,1);b.classList.toggle('on')}
  if(cur.typ==='suple')$('#doses').innerHTML=dosesHtml();updKc();
  if(d.co==='Body by Science'){$('#bbs').style.display=cur.co.includes('Body by Science')?'block':'none'}}
 else if(d.addex){const p=$('#picker');p.innerHTML=p.innerHTML?'':pickerHtml()}
 else if(d.ex){const l=lastSet(d.ex);cur.sets.push({ex:d.ex,kg:l?l.kg:null,reps:null,tul:null});$('#picker').innerHTML='';$('#sets').innerHTML=setsHtml()}
 else if(d.rm){cur.sets.splice(+d.rm,1);if(sw){clearInterval(sw.h);sw=null}$('#sets').innerHTML=setsHtml()}
 else if(d.swi!==undefined){const i=+d.swi;if(sw&&sw.i===i){const sec=Math.round((Date.now()-sw.t0)/1000);clearInterval(sw.h);sw=null;cur.sets[i].tul=sec;$('#sets').innerHTML=setsHtml()}else{if(sw)clearInterval(sw.h);sw={i,t0:Date.now()};sw.h=setInterval(()=>{const el=$('#tul'+i);if(el)el.value=Math.round((Date.now()-sw.t0)/1000)},500);$('#sets').innerHTML=setsHtml()}}});
$('#sheet').addEventListener('change',async e=>{if(!['f_ph','f_ph2'].includes(e.target.id)||!e.target.files[0])return;cur.photos=cur.photos||[];for(const f of [...e.target.files]){try{const photo=await shrink(f,1024,.72),thumb=await shrink(f,240,.6);cur.photos.push({photo,thumb});$('#f_prevs').insertAdjacentHTML('beforeend',`<img src="${thumb}" alt="">`)}catch(x){toast('Nie udało się wczytać zdjęcia')}}e.target.value=''});
function updKc(){const k=$('#f_kc'),il=$('#f_il');if(!k||cur.kcalEd||!KCAL[cur.typ])return;const v=estKcal(cur.typ,cur.co,il?+il.value:0);k.value=v??''}
$('#sheet').addEventListener('input',e=>{if(e.target.id==='f_kc')cur.kcalEd=true;if(e.target.id==='f_il')updKc();if(e.target.id==='f_il'&&e.target.type==='range')$('#f_v').textContent=e.target.value;const d=e.target.dataset;if(d.si!==undefined&&cur){cur.sets[+d.si][d.sf]=e.target.value===''?null:+e.target.value}});
let pdfMsg='',picking=false;
$('#pdfIn').addEventListener('change',async e=>{picking=false;const f=e.target.files[0];if(!f)return;pdfMsg='Czytam grafik '+f.name+'…';render();
 try{const t=await importRoster(f);pdfMsg='Wgrano: '+t;toast('Grafik wgrany')}catch(x){pdfMsg='Nie udało się: '+(x.message||x);toast('Błąd grafiku')}e.target.value='';render()});
$('#pdfIn').addEventListener('click',()=>{picking=true});
$('#view').addEventListener('input',e=>{if(e.target.id!=='cmpR')return;const v=e.target.value,c=e.target.previousElementSibling;c.querySelector('.top').style.clipPath=`inset(0 0 0 ${v}%)`;c.querySelector('.bar').style.left=v+'%'});
['#bpCam','#bpGal'].forEach(id=>$(id).addEventListener('change',async e=>{picking=false;await bpPick(e.target.files[0]);e.target.value=''}));
DARK.addEventListener&&DARK.addEventListener('change',render);
$('#dialov').addEventListener('click',e=>{if(e.target.id==='dialov'){$('#dialov').classList.remove('open');return}const g=e.target.closest('[data-v]');if(g){const v=+g.dataset.v;if(DL.mode==='h'){DL.h=v;DL.mode='m'}else DL.m=v;drawDial();return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.dd){const t=new Date(DL.date+'T12:00Z');t.setUTCDate(t.getUTCDate()+ +d.dd);DL.date=t.toISOString().slice(0,10);drawDial()}
 else if(d.dm){DL.mode=d.dm;drawDial()}
 else if(d.dx==='now'){const v=localStr(rnd5(new Date()),cur?cur.tz:devTz());DL={date:v.slice(0,10),h:+v.slice(11,13),m:+v.slice(14,16),mode:'h'};drawDial()}
 else if(d.dx==='cancel')$('#dialov').classList.remove('open');
 else if(d.dx==='ok'){const p=n=>String(n).padStart(2,'0');const v=`${DL.date}T${p(DL.h)}:${p(DL.m)}`;$('#f_when').value=v;$('#f_whenBtn').textContent=fmtWhen(v);$('#dialov').classList.remove('open')}});
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!picking){render();sync()}});
setInterval(clock,30000);setInterval(()=>{if(Q.length)sync()},60000);
render();sync();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
